<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NotyAlert</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <div id="content">Cargando...</div>

  <script>
    fetch('PRIVACY_POLICY.md')
      .then(res => res.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      });
  </script>

</body>
</html>
