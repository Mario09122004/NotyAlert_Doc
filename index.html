<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>NotyAlert - Documentación Legal</title>
  <meta name="description" content="Documentación legal, política de privacidad, términos de uso y licencia de NotyAlert, app móvil de alarmas y recordatorios 100% offline.">
  <meta name="author" content="NotyAlert">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="Logo NotyMe.svg">
  
  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Markdown Parser (marked.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Top bar controls: Language switch & Theme toggle -->
  <aside class="top-bar" aria-label="Controles de visualización">
    <div class="control-pill" role="group" aria-label="Selector de idioma">
      <button type="button" class="lang-btn" data-lang="es" id="btn-lang-es" aria-pressed="false">ES</button>
      <button type="button" class="lang-btn" data-lang="en" id="btn-lang-en" aria-pressed="false">EN</button>
    </div>

    <button type="button" class="icon-btn" id="theme-toggle-btn" title="Cambiar tema" aria-label="Cambiar tema">
      <!-- Sun Icon (for switching to light) -->
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
      </svg>
      <!-- Moon Icon (for switching to dark) -->
      <svg class="icon-moon" style="display: none;" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12.3 2a10 10 0 0 0-.19 20 10.04 10.04 0 0 0 9.95-8.99 1 1 0 0 0-1.21-1.08A8 8 0 0 1 11.08 3.15a1 1 0 0 0-.78-1.15z"/>
      </svg>
    </button>
  </aside>

  <!-- Centered Brand Header -->
  <header class="app-header">
    <div class="logo-wrapper">
      <img src="Logo NotyMe.svg" alt="NotyAlert Logo" class="app-logo" width="80" height="85">
    </div>
    <h1 class="app-title">NotyAlert</h1>
    <p class="app-tagline" id="tagline-text">Documentación Legal y Políticas</p>
    <div class="tagline-badge" id="tagline-badge">Offline-First • Privacidad por Diseño</div>
  </header>

  <!-- Document Tabs Navigation -->
  <nav class="nav-container" aria-label="Navegación de documentos legales">
    <div class="nav-tabs" role="tablist">
      <button type="button" class="tab-btn active" role="tab" id="tab-privacy" data-doc="privacy" aria-selected="true">
        Política de Privacidad
      </button>
      <button type="button" class="tab-btn" role="tab" id="tab-terms" data-doc="terms" aria-selected="false">
        Términos y Condiciones
      </button>
      <button type="button" class="tab-btn" role="tab" id="tab-eula" data-doc="eula" aria-selected="false">
        Licencia (EULA)
      </button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="doc-wrapper">
    <article class="doc-card" id="document-card">
      
      <!-- Rendered Markdown Container -->
      <div id="markdown-content" class="markdown-body">
        <!-- Rendered asynchronously by app.js -->
      </div>
    </article>
  </main>

  <!-- Back to top button -->
  <button type="button" class="back-to-top" id="back-to-top" title="Volver arriba" aria-label="Volver arriba">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
    </svg>
  </button>

  <!-- Footer -->
  <footer class="app-footer">
    <p id="footer-rights">NotyAlert. Todos los derechos reservados. Aplicación móvil para Android.</p>
  </footer>

  <!-- Embedded Docs Data (for seamless offline / file:// protocol support) -->
  <script src="docs-data.js"></script>
  <!-- App Script -->
  <script src="app.js"></script>
</body>
</html>
